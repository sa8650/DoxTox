<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoxTox Technologies Ltd. — Software Development Company</title>
    <meta name="description" content="DoxTox Technologies Ltd. crafts cutting-edge digital products — AI tools, multi-store management systems and scalable platforms for startups and enterprises." />
    <meta name="keywords" content="DoxTox, software development, Zudo AI, EMS, InfluencerOS, web development, cloud, AI" />
    <meta name="author" content="DoxTox Technologies Ltd." />
    <link rel="canonical" href="https://doxtox.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DoxTox Technologies Ltd." />
    <meta property="og:title" content="DoxTox — Build smarter. Ship faster." />
    <meta property="og:description" content="Cutting-edge digital products for startups and enterprises. From AI tools to scalable platforms — we bring your vision to life." />
    <meta property="og:url" content="https://doxtox.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236c5ce7'/%3E%3Cpath d='M55 12 28 55h16l-5 33 33-45H54z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="assets/app.css" />
    <!-- Hide dynamic content before first paint until saved content renders
         (prevents the old hardcoded text from flashing). If JS is off the class
         is never added, so the static content remains visible; a 4s failsafe
         also releases it if the API is unreachable. -->
    <script>
      (function () {
        var release = function () { document.body && document.body.classList.remove('content-loading'); };
        window.__doxRelease = release;
        document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('content-loading'); });
        setTimeout(release, 4000);
      })();
    </script>
  </head>
  <body class="landing">
    <!-- ===== HEADER ===== -->
    <header id="header">
      <div class="container nav">
        <a href="#home" class="logo">
          <i class="fas fa-bolt" data-brand-icon></i>
          <span data-brand-name></span>
        </a>
        <ul class="nav-links" id="navLinks">
          <li><a href="#products" data-nav="products"></a></li>
          <li><a href="#features" data-nav="features"></a></li>
          <li><a href="#about" data-nav="about"></a></li>
          <li><a href="#contact" class="nav-cta btn btn-sm btn-outline" data-nav="contact"></a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- ===== HERO ===== -->
    <section class="hero" id="home">
      <div class="container hero-grid">
        <div class="hero-content">
          <span class="section-label" data-hero-label></span>
          <h1>
            <span data-hero-title1></span><br />
            <span class="highlight" data-hero-title2></span>
          </h1>
          <p data-hero-subtitle></p>
          <div class="hero-buttons">
            <a href="#products" class="btn btn-primary" data-hero-primary-link>
              <i class="fas" data-hero-primary-icon></i>
              <span data-hero-primary-label></span>
            </a>
            <a href="#contact" class="btn btn-outline">
              <span data-hero-secondary-label></span>
              <i class="fas icon-right" data-hero-secondary-icon></i>
            </a>
          </div>
          <div class="hero-stats" data-stats></div>
        </div>
        <div class="hero-visual" data-badges>
          <div class="hero-code-block" data-code-block></div>
        </div>
      </div>
    </section>

    <!-- ===== PRODUCTS ===== -->
    <section class="section" id="products">
      <div class="container">
        <div class="section-header centered">
          <span class="section-label" data-products-label></span>
          <h2 class="section-title" data-products-title></h2>
          <p class="section-sub" data-products-subtitle></p>
        </div>
        <div class="products-grid" data-products-grid></div>
      </div>
    </section>

    <!-- ===== FEATURES ===== -->
    <section class="section" id="features" style="padding-top: 0">
      <div class="container">
        <div class="section-header centered">
          <span class="section-label" data-features-label></span>
          <h2 class="section-title" data-features-title></h2>
        </div>
        <div class="features-grid" data-features-grid></div>
      </div>
    </section>

    <!-- ===== ABOUT ===== -->
    <section class="section" id="about">
      <div class="container about-grid">
        <div class="about-content">
          <span class="section-label" data-about-label></span>
          <h2>
            <span data-about-title1></span> <br />
            <span class="highlight" data-about-title2></span>
          </h2>
          <div data-about-paragraphs></div>
          <ul class="check-list" data-about-checks></ul>
          <a href="#contact" class="btn btn-primary" data-about-cta>
            <i class="fas" data-about-cta-icon></i>
            <span data-about-cta-label></span>
          </a>
        </div>
        <div class="about-image">
          <div class="code-snippet">
            <div class="line"><span class="cm">// DoxTox philosophy</span></div>
            <div class="line"><span class="kw">const</span> <span class="fn">build</span> = (<span class="str">'purpose'</span>) =&gt; {</div>
            <div class="line">&nbsp;&nbsp;<span class="kw">return</span> <span class="fn">craft</span>({</div>
            <div class="line">&nbsp;&nbsp;&nbsp;&nbsp;<span class="str">'quality'</span>: <span class="kw">'premium'</span>,</div>
            <div class="line">&nbsp;&nbsp;&nbsp;&nbsp;<span class="str">'impact'</span>: <span class="kw">'measurable'</span></div>
            <div class="line">&nbsp;&nbsp;});</div>
            <div class="line">};</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== CONTACT ===== -->
    <section class="section" id="contact">
      <div class="container">
        <div class="section-header centered">
          <span class="section-label" data-contact-label></span>
          <h2 class="section-title" data-contact-title></h2>
        </div>
        <div class="contact-wrapper">
          <div class="contact-info">
            <h3 data-contact-info-title></h3>
            <p data-contact-info-text></p>
            <div class="contact-item">
              <i class="fas fa-envelope"></i>
              <span><a data-contact-email></a></span>
            </div>
            <div class="contact-item"><i class="fas fa-phone-alt"></i><span data-contact-phone></span></div>
            <div class="contact-item"><i class="fas fa-map-marker-alt"></i><span data-contact-address></span></div>
            <div class="social-links" data-social-links></div>
          </div>
          <form class="contact-form" id="contactForm" novalidate>
            <input type="text" name="name" placeholder="Your name" required maxlength="120" autocomplete="name" />
            <input type="email" name="email" placeholder="Email address" required maxlength="160" autocomplete="email" />
            <input type="text" name="company" placeholder="Company (optional)" maxlength="160" autocomplete="organization" />
            <textarea name="message" placeholder="Tell us about your project…" required maxlength="5000"></textarea>
            <input class="hp-field" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <button type="submit" class="btn btn-primary" id="contactSubmit"><i class="fas fa-paper-plane"></i> Send message</button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
      <div class="container footer-grid">
        <div class="copy">
          &copy; <span data-year></span> <span data-footer-brand></span>
          <span data-footer-tagline></span>
        </div>
        <ul class="footer-links" data-footer-links></ul>
      </div>
    </footer>

    <script src="assets/app.js"></script>
  </body>
</html>
