name = "doxtox"
compatibility_date = "2026-08-05"
pages_build_output_dir = "."

# No D1 binding is declared here on purpose.
#
# Cloudflare Pages validates this file at build time and rejects any
# [[d1_databases]] block that does not contain a database_id. We never commit
# that ID, so the binding is configured entirely in the dashboard:
#
#   Pages project → Settings → Functions → D1 database bindings
#       Variable name: DB   →   D1 database: doxtox
#
# For local development the binding is provided on the CLI instead:
#   wrangler pages dev . --d1=DB
# (see the `dev` script in package.json).
